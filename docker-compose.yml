# Локальна інфраструктура для розробки bravi.
# MinIO — S3-сумісне об'єктне сховище медіа (логотипи магазинів тощо).
#   API:     http://localhost:9000
#   Консоль: http://localhost:9001  (логін/пароль = MEDIA_S3_ACCESS_KEY / MEDIA_S3_SECRET_KEY)
# Сервіс minio-init одноразово створює bucket і вмикає анонімне читання (public-read),
# щоб logo_url віддавав зображення напряму.
#
# Запуск:   docker compose up -d
# Зупинка:  docker compose down        (дані лишаються у volume minio-data)
# Скидання: docker compose down -v     (видаляє і дані)

services:
  minio:
    image: minio/minio:latest
    container_name: bravi-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Чекає готовності MinIO, створює bucket і вмикає public-read, потім завершується.
  minio-init:
    image: minio/mc:latest
    container_name: bravi-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-bravi-media}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 2;
      done &&
      mc mb --ignore-existing local/\"$$MEDIA_S3_BUCKET\" &&
      mc anonymous set download local/\"$$MEDIA_S3_BUCKET\" &&
      echo 'MinIO bucket ready: '\"$$MEDIA_S3_BUCKET\"
      "

volumes:
  minio-data:
