kind: Application

server:
  port: 8083
  servlet:
    context-path: /api

spring:
  application:
    name: bravi
  jpa:
    hibernate:
      ddl-auto: validate                              # перевірка відповідності entity і таблиць
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    locations: classpath:db.migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloack.base-url}/realms/${keycloack.realm}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm.jdbc.bind: TRACE
      springframework:
        security: DEBUG
        web: INFO


keycloack:
  base-url: http://localhost:8080
  realm: bravi
  client-id: user-token-proxy

