kind: Application

server:
  port: 8083
  servlet:
    context-path: /api

spring:
  application:
    name: bravi
  jpa:
    hibernate:
      ddl-auto: validate                              # verifies that entities match the tables
    show-sql: false                                   # SQL is emitted by the org.hibernate.SQL logger (local profile)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    locations: classpath:db.migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloack.base-url}/realms/${keycloack.realm}

logging:
  pattern:
    # %replace hides the empty brackets outside of a request context, such as startup or background tasks
    correlation: "%replace([%X{requestId:-}] ){'\\[\\] ',''}%replace([%X{accountId:-}/%X{storeId:-}] ){'\\[/\\] ',''}"
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    ua.com.bravi.bravi: ${APP_LOG_LEVEL:INFO}
    ua.com.bravi.bravi.access: ${ACCESS_LOG_LEVEL:INFO}    # HTTP access-log (AccessLogFilter)
    # Diagnostics: DEBUG enables logging of payloads and service arguments, which carry personal data
    ua.com.bravi.bravi.payload: ${PAYLOAD_LOG_LEVEL:INFO}
    ua.com.bravi.bravi.calls: ${SERVICE_CALL_LOG_LEVEL:INFO}
    org:
      hibernate:
        SQL: WARN
        orm.jdbc.bind: WARN
      springframework:
        security: WARN
        web: WARN
      flywaydb: INFO

keycloack:
  base-url: http://localhost:8080
  realm: bravi
  client-id: backend-service

bravi:
  security:
    internal-role: ${INTERNAL_API_ROLE:auth_service}
    user-role: ${USER_API_ROLE:bravi_user}
  media:
    endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
    region: ${MEDIA_S3_REGION:us-east-1}
    bucket: ${MEDIA_S3_BUCKET:bravi-media}
    access-key: ${MEDIA_S3_ACCESS_KEY:minioadmin}
    secret-key: ${MEDIA_S3_SECRET_KEY:minioadmin}
    path-style-access: ${MEDIA_S3_PATH_STYLE:true}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/bravi-media}
    presign-ttl: 10m

