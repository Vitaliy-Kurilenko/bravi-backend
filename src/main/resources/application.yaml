server:
  port: 8083
  servlet:
    context-path: /api

spring:
  application:
    name: bravi
  jpa:
    hibernate:
      ddl-auto: validate                              # перевірка відповідності entity і таблиць
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE

keycloack:
  base-url: http://localhost:8080
  realm: seller
  client-id: cabinet
