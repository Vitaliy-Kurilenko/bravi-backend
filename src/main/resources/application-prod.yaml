# Production profile: structured logging to stdout (ECS JSON); log collection is done by docker/k8s.
# MDC keys (requestId, accountId, storeId, userExtId) and SLF4J key-value pairs
# appear in the JSON as separate fields rather than inside the message.
# Run: SPRING_PROFILES_ACTIVE=prod java -jar bravi.jar
kind: Application

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:unknown}
        environment: ${APP_ENVIRONMENT:prod}
  level:
    root: ${ROOT_LOG_LEVEL:WARN}
    ua.com.bravi.bravi: ${APP_LOG_LEVEL:INFO}
    # Payload and service-call logging is pinned to INFO here, so bodies and service arguments
    # never reach production logs without an explicit decision.
    ua.com.bravi.bravi.payload: ${PAYLOAD_LOG_LEVEL:INFO}
    ua.com.bravi.bravi.calls: ${SERVICE_CALL_LOG_LEVEL:INFO}
